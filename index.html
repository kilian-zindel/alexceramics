<!DOCTYPE html>

<html lang="en">
<head>
    <!-- Boilerplate -->
    <meta charset="UTF-8">
    <title>Alex K. Art</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
     
    <!-- My Code -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="page-heading">Ceramics</div>
        <div class="page-subheading">By Alex K.</div>
    </div>

    <!-- IMAGE GALLERY -->
    <!-- filters -->
    <div class="controls" style="margin-top: 48px; padding-left: 8px;">
        <button class="filter active" data-filter="all" style="margin-bottom: 12px">Selected Works</button>
        <button class="filter" data-filter="ware">Wares</button>
        <button class="filter" data-filter="sculpture">Sculptures</button>
        <button class="filter" data-filter="painting">Paintings</button>
    </div>

    <!-- images -->
    <div class="images-container"></div>

</html>
